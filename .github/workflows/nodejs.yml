name: FWCloud-Updater CI

on:
  push:
    branches: [main, devel, ENS]
  pull_request:
    branches: [main, devel, ENS]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  ANALYSIS_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  quality:
    name: FWCloud-Updater Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ANALYSIS_COMMIT }}

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned npm
        run: |
          NPM_VERSION=$(node -p 'require("./package.json").packageManager.split("@")[1]')
          npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-audit --no-fund
      - name: Show runtime versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint:check
      - name: Run Prettier
        run: npm run format:check
      - name: Test CI report tooling
        run: npm run test:ci-tools

  secrets:
    name: FWCloud-Updater Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ANALYSIS_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks
        env:
          GITLEAKS_ARCHIVE: gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}" \
            --output "$RUNNER_TEMP/$GITLEAKS_ARCHIVE"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$RUNNER_TEMP/$GITLEAKS_ARCHIVE" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$GITLEAKS_ARCHIVE" -C "$RUNNER_TEMP" gitleaks
          VERSION=$("$RUNNER_TEMP/gitleaks" version)
          test "${VERSION#v}" = "$GITLEAKS_VERSION"
      - name: Determine scan scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          [[ "$ANALYSIS_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ANALYSIS_COMMIT"
          test "$(git rev-parse --is-shallow-repository)" = false
          git cat-file -e "$ANALYSIS_COMMIT^{commit}"
          if [ "$EVENT_NAME" = pull_request ]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "$BASE_SHA^{commit}"
            MERGE_BASE=$(git merge-base "$BASE_SHA" "$ANALYSIS_COMMIT")
            RANGE="$MERGE_BASE..$ANALYSIS_COMMIT"
            SCAN_SCOPE="pull-request:$RANGE"
          elif [ "$EVENT_NAME" = push ]; then
            [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]
            if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              RANGE="$ANALYSIS_COMMIT"
              SCAN_SCOPE="new-branch-history:$RANGE"
            else
              git cat-file -e "$BEFORE_SHA^{commit}"
              RANGE="$BEFORE_SHA..$ANALYSIS_COMMIT"
              SCAN_SCOPE="push:$RANGE"
            fi
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then
            RANGE="--all"
            SCAN_SCOPE="full-history"
          else
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 1
          fi
          # Patch every committed change: .gitattributes (-diff, binary,
          # diff=<driver>) and NUL bytes must not hide content, and merge
          # commits must expose content added while resolving them.
          echo "log_opts=--text --no-textconv --remerge-diff $RANGE" >> "$GITHUB_OUTPUT"
          echo "scan_scope=$SCAN_SCOPE" >> "$GITHUB_OUTPUT"
      - name: Scan secrets
        id: gitleaks
        env:
          GITLEAKS_LOG_OPTS: ${{ steps.scope.outputs.log_opts }}
        run: |
          umask 077
          rm -rf reports/secrets
          mkdir -p reports/secrets
          test ! -e .gitleaksignore
          test ! -L .gitleaksignore
          : > "$RUNNER_TEMP/gitleaks.ignore"
          set +e
          "$RUNNER_TEMP/gitleaks" git . \
            --config .gitleaks.toml \
            --log-opts="$GITLEAKS_LOG_OPTS" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks.ignore" \
            --ignore-gitleaks-allow \
            --redact=100 \
            --report-format json \
            --report-path reports/secrets/gitleaks.json \
            --timeout 300 \
            --log-level error \
            --no-banner \
            --no-color \
            > "$RUNNER_TEMP/gitleaks.log" 2>&1
          STATUS=$?
          set -e
          # Error messages only, never findings. Gitleaks 8.30.1 exits 0 after
          # git errors, so any logged line makes the report step fail.
          cat "$RUNNER_TEMP/gitleaks.log"
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          echo "log_lines=$(awk 'END { print NR }' "$RUNNER_TEMP/gitleaks.log")" >> "$GITHUB_OUTPUT"
      - name: Verify and summarize secret scan
        if: ${{ !cancelled() && steps.gitleaks.outcome != 'skipped' }}
        env:
          GITLEAKS_EXIT_CODE: ${{ steps.gitleaks.outputs.exit_code }}
          GITLEAKS_LOG_LINES: ${{ steps.gitleaks.outputs.log_lines }}
          GITLEAKS_LOG_OPTS: ${{ steps.scope.outputs.log_opts }}
          GITLEAKS_SCAN_SCOPE: ${{ steps.scope.outputs.scan_scope }}
        run: node scripts/gitleaks-report.cjs
      - name: Remove detailed secret report
        if: ${{ always() }}
        run: |
          rm -f reports/secrets/gitleaks.json "$RUNNER_TEMP/gitleaks.ignore" "$RUNNER_TEMP/gitleaks.log"
          test ! -e reports/secrets/gitleaks.json
      - name: Upload sanitized secret scan evidence
        if: ${{ !cancelled() && steps.gitleaks.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: updater-secrets-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/secrets/metadata.json
          if-no-files-found: error
          retention-days: 90

  test:
    name: FWCloud-Updater Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ANALYSIS_COMMIT }}

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned npm
        run: |
          NPM_VERSION=$(node -p 'require("./package.json").packageManager.split("@")[1]')
          npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-audit --no-fund
      - name: Show runtime versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Build FWCloud-Updater
        run: npm run build
      - name: Run tests and collect reports
        id: tests
        env:
          NODE_MAJOR: ${{ matrix.node-version }}
        run: |
          if [ "$NODE_MAJOR" = 22 ]; then
            npm run test:coverage:ci
          else
            npm run test:ci
          fi
      - name: Validate reports and record analysis context
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          COVERAGE_EXPECTED: ${{ matrix.node-version == '22' }}
        run: npm run ci:reports
      - name: Upload test reports
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: updater-tests-node${{ matrix.node-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/tests/
            reports/metadata.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload reference coverage
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' && matrix.node-version == '22' }}
        uses: actions/upload-artifact@v4
        with:
          name: updater-coverage-node22-${{ github.run_id }}
          path: reports/coverage/
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  updater-ci:
    name: updater-ci
    if: ${{ always() }}
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require all checks to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success
