name: FWCloud-Updater CI

on:
  push:
    branches: [main, devel, ENS]
  pull_request:
    branches: [main, devel, ENS]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  ANALYSIS_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  quality:
    name: FWCloud-Updater Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ANALYSIS_COMMIT }}

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned npm
        run: |
          NPM_VERSION=$(node -p 'require("./package.json").packageManager.split("@")[1]')
          npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-audit --no-fund
      - name: Show runtime versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint:check
      - name: Run Prettier
        run: npm run format:check
      - name: Test CI report tooling
        run: npm run test:ci-tools

  test:
    name: FWCloud-Updater Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ANALYSIS_COMMIT }}

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned npm
        run: |
          NPM_VERSION=$(node -p 'require("./package.json").packageManager.split("@")[1]')
          npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-audit --no-fund
      - name: Show runtime versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Build FWCloud-Updater
        run: npm run build
      - name: Run tests and collect reports
        id: tests
        env:
          NODE_MAJOR: ${{ matrix.node-version }}
        run: |
          if [ "$NODE_MAJOR" = 22 ]; then
            npm run test:coverage:ci
          else
            npm run test:ci
          fi
      - name: Validate reports and record analysis context
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          COVERAGE_EXPECTED: ${{ matrix.node-version == '22' }}
        run: npm run ci:reports
      - name: Upload test reports
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: updater-tests-node${{ matrix.node-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/tests/
            reports/metadata.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload reference coverage
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' && matrix.node-version == '22' }}
        uses: actions/upload-artifact@v4
        with:
          name: updater-coverage-node22-${{ github.run_id }}
          path: reports/coverage/
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  updater-ci:
    name: updater-ci
    if: ${{ always() }}
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require all checks to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success
