# Verify this project key and its GitHub binding before enabling hosted analysis.
sonar.organization=soltecsis
sonar.projectKey=soltecsis_fwcloud-updater
sonar.host.url=https://sonarcloud.io

sonar.sources=src,config
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/*.spec.js,**/*.test.ts,**/*.test.js,**/*.d.ts,**/generated/**,**/__generated__/**,**/*.generated.ts,**/*.generated.js,**/dist/**,**/build/**,**/node_modules/**,**/reports/**,**/coverage/**,test/**
sonar.test.exclusions=**/generated/**,**/__generated__/**,**/dist/**,**/build/**,**/node_modules/**,**/reports/**,**/coverage/**
sonar.scm.exclusions.disabled=true
sonar.typescript.tsconfigPaths=tsconfig.sonar.json
sonar.javascript.lcov.reportPaths=reports/coverage/lcov.info
sonar.sourceEncoding=UTF-8

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
